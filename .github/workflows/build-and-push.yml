name: Build and push

on:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code 
        run: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
              ${{vars.DOCKERHUB_USER}}/nodejs-app:${{github.sha}}
              ${{vars.DOCKERHUB_USER}}/nodejs-app:${{github.ref_name}}
              ${{vars.DOCKERHUB_USER}}/nodejs-app:latest
 
      

